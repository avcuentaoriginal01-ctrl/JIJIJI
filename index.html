<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>Para ti 🌻</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none}
    canvas{display:block;width:100vw;height:100vh}

    /* Pantalla de inicio */
    #splash {
      position:fixed;inset:0;
      background:radial-gradient(ellipse at 50% 40%, #0d2010, #020602);
      display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      z-index:100;
      gap:28px;
    }
    #splash h1 {
      font-family:Georgia,serif;
      color:#ffe44d;
      font-size:clamp(1.6rem,6vw,2.6rem);
      text-shadow:0 0 24px #ffaa00, 0 0 50px #ff6600;
      letter-spacing:3px;
      text-align:center;
      padding:0 20px;
    }
    #splash p {
      font-family:Georgia,serif;
      color:rgba(255,220,120,0.7);
      font-size:clamp(0.9rem,3vw,1.1rem);
      letter-spacing:1px;
    }
    #startBtn {
      background:linear-gradient(135deg,#8b1438,#c02050);
      color:#fff;
      border:none;
      border-radius:50px;
      padding:16px 48px;
      font-size:clamp(1rem,4vw,1.3rem);
      font-family:Georgia,serif;
      letter-spacing:2px;
      cursor:pointer;
      box-shadow:0 0 30px rgba(180,20,60,0.6);
      transition:transform .15s, box-shadow .15s;
    }
    #startBtn:active { transform:scale(0.95); }
    #splash.hidden {
      opacity:0;
      pointer-events:none;
      transition:opacity 1s ease;
    }
  </style>
</head>
<body>
  <div id="splash">
    <h1>🌻 Para ti 🌹</h1>
    <p>toca para abrir</p>
    <button id="startBtn">Abrir ❤️</button>
  </div>
  <canvas id="c"></canvas>
  <audio id="bg" src="sonido.mp3" loop preload="auto"></audio>
  <script src="main.js"></script>
</body>
</html>
